seed: 42
use_wandb: false
wandb:
  project: #insert PROJECT NAME
  entity: #insert USERNAME
run_name: superdec_base
dataset: shapenet  
device: cuda

checkpoints:
  resume_from: #
  keep_epoch: False

superdec:
  decoder:
    n_queries: 16
    n_layers: 3 # number of transformer decoders
    n_heads: 1
    masked_attention: false
    swapped_attention: false
    dim_feedforward: 512 # default
    deep_supervision: False
    pos_encoding_type: sinusoidal
    dropout: 0.1
    staged_params: false
  point_encoder:
    in_channels: 3
    out_channels: 128
    kernel_size: 3
    resolution: 32
    voxelization:
      normalize: True
      eps: 0
    l1:
      in_channels: 3
      out_channels: 64
      kernel_size: 3
      resolution: 32
      voxelization:
        normalize: True
        eps: 0
    l2:
      in_channels: 64
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0
    l3:
      in_channels: 128
      out_channels: 128
      kernel_size: 3
      resolution: 16
      voxelization:
        normalize: True
        eps: 0  

shapenet:
  path: data/ShapeNet
  categories: null #['03001627'] 
  normalize: False

sqzero_lmdb:
  path: /hnvme/workspace/v123be13-WS/data/SQ_Zero/1k_naive
  train_split: train.txt
  val_split: test.txt
  n_points: 4096
  normalize: true
  normal_mode: radial
  load_sidecars: false
  kmax: 8
  max_train_samples: null
  max_val_samples: null

trainer:
  save_path: checkpoints
  save_every_n_epochs: 50
  num_epochs: 1000
  batch_size: 32
  num_workers: 4
  evaluate_every_n_epochs: 1
  augmentations: True
  grad_clip_norm: null
optimizer:
  lr: 4e-4 #1e-4 #1e-4   0.001
  weight_decay: 0 # default
  betas: [0.9, 0.999] # default
  enable_scheduler: True # True
  only_heads: False

scheduler:  
  _target_: torch.optim.lr_scheduler.OneCycleLR 
  max_lr: ${optimizer.lr} 
  epochs: ${trainer.num_epochs}
  steps_per_epoch: -1

loss:
  n_samples: 500
  w_sps: 0.1 #0.6 
  w_ext: 0.01 #0.01 
  w_cub: 1.0 #1.0 
  w_cd: 1.0

  type: original

  # Used only when loss.type=supervised_hungarian
  w_sup_exist: 1.0
  w_sup_assign: 1.0
  match_w_assign: 1.0
  match_w_exist: 0.1
  eps: 1.0e-8

  # Supervised geometry target:
  #   gt_surface  = predicted SQ surface vs sampled GT SQ surface
  #   part_points = predicted SQ surface vs actual labeled input points
  surface_target: gt_surface

  # For surface_target=part_points:
  # L = d(part_points -> pred_surface) + beta * d(pred_surface -> part_points)
  part_cd_beta: 0.0
  part_cd_max_points_per_part: 512

  w_sup_surface: 0.0

  # Strict staged SQ geometry v1.
  # Used only when loss.type=supervised_hungarian and
  # superdec.decoder.staged_params=true.
  use_staged_surface: false
  stage1_fixed_radius: 0.575
  w_stage1_surface: 0.0
  w_stage2_surface: 0.0
  w_stage3_surface: 0.0

  # Synthetic-only helper loss for SQ-Zero:
  # directly supervise eps_1, eps_2 after Hungarian matching.
  # Keep 0.0 for real datasets without GT SQ parameters.
  w_sup_shape_param: 0.0

  # Synthetic-only helper loss:
  # sign-invariant local z-axis supervision after Hungarian matching:
  # L = 1 - dot(z_pred, z_gt)^2
  w_sup_z_axis: 0.0

  # Synthetic diagnostic:
  # GT trans/scale/rotate + predicted shape vs full GT SQ surface.
  # Isolates whether eps_1/eps_2 can be learned geometrically.
  w_sup_shape_oracle_surface: 0.0

  # Synthetic diagnostic:
  # GT-conditioned high-curvature eta/omega sampling + pointwise L2.
  # Uses GT SQ only to select important sample locations.
  w_sup_highcurv_pointwise_surface: 0.0
  w_sup_highcurv_chamfer_surface: 0.0
  highcurv_n_samples: 128
  highcurv_eta_bins: 32
  highcurv_omega_bins: 64
  highcurv_alpha: 2.0
  highcurv_uniform_mix: 0.0
  highcurv_jitter: 1.0
  highcurv_probe_delta: 0.05

  # Part-normal auxiliary loss. Requires sqzero_lmdb.normal_mode=sidecar
  # and <key>.normals LMDB sidecars.
  # Signed default: L = mean(1 - dot(input_normal, nearest_pred_sq_normal)).
  w_sup_normal: 0.0
  normal_unsigned: false
  normal_max_points_per_part: 512
  normal_eps: 1.0e-8

  # Location-independent normal-direction Chamfer.
  # Uses only normal directions, not xyz nearest neighbors.
  w_sup_normal_dir: 0.0
  normal_dir_beta: 0.25

  # Surface sampler for supervised SQ surface losses.
  # equal_distance = original SuperDec/Pilu-style sampler
  # naive = uniform parameter-grid sampler matching SQ-Zero naive sampling
  surface_sampler_type: equal_distance
  surface_naive_n_theta: 12
  surface_naive_n_phi: 12
  surface_n_samples: 128
  surface_D_eta: 0.05
  surface_D_omega: 0.05

  debug_match_every: 0
  debug_match_max_samples: 4
  
visualization:
  res_primitives: 40
